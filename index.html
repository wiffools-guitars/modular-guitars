<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            padding: 50px;
        }
        h1 {
            color: purple;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 20px 0;
        }
        a:link {
            color: green;
            text-decoration: none;
        }
        a:visited {
            color: blue;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Corrected structure: h1 shouldn't be inside a paragraph -->
        <h1>Your Name</h1>

        <!-- Responsive image without layout-breaking absolute positioning -->
        <img src="https://wikimedia.org" alt="Stars in the sky">

        <!-- Wikipedia link -->
        <p><a href="https://wikipedia.org" target="_blank">I love Astronomy!</a></p>
    </div>

</body>
</html>
